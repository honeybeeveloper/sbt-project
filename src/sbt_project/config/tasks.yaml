analyze_task:
    description: >
      Analyze and summarize the sales activities based on {input_test}.
      and analyze the sales activities by date.
    expected_output: >
      A detailed summary and analysis of past sales activities,
      including engagement frequency, type, and outcomes.
    agent: analyst

consulting_task:
    description: >
      Generate customized sales strategies for each customer by combining sales activity data and customer characteristics.
      and recommend future sales activities.
      Account means a customer.
    expected_output: >
        Strategic sales recommendations per customer, including the next best action and evidence
        reasoning behind it, and any relevant considerations for success.
    agent: consultant

translate_task:
    description: >
      Translate the each analyst's English output and consultant’s English output into clear and natural Korean. 
      Account means a customer. 
      Finally Change it to a markdown format.
    expected_output: >
      A Korean translation of the consultant’s recommendations that preserves original meaning
      and is easy for Korean sales reps to understand.
    agent: translator
