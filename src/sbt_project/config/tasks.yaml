corporate_curation:
  description: >
    {company}의 수집 범위를 확정하고 신뢰 가능한 1차, 2차 출처 목록을 큐레이션합니다.  
    루머/블로그/추측성 글은 제외하고, 각 출처의 신뢰도 기준과 수집 기간(최근 5년)을 명시합니다.
  expected_output: > 
    사업 영역, 시장, 재무, 리스크, 평판, 우선순위 출처(예: 공시, 사업보고서, 애널리스트 리포트, 규제 기관 자료, 주요 매체)와 배제 기준
  agent: researcher

corporate_profiling:
  description: > 
    {company}의 현재 사업 종류, 주요 제품/서비스, 고객군, 수익 모델과 외부 평가(강점/약점/평판)를 최근 5년 자료로 수집·정리합니다. 모든 사실에는 날짜와 출처를 명시합니다.
  expected_output: > 
    1. 표 형태: [사업영역 | 설명 | 주요 제품/서비스 | 매출 기여 추정 | 평가(강/약점) | 근거 요약 | 날짜 | 출처 UrL]
    2. 핵심 인사이트 5개(한 줄 요약 + 근거 출처)
  agent: researcher

market_sizing:
  description: > 
    {company}가 속한 핵심 시장의 TaM/saM/sOM 추정치와 {company} 및 주요 경쟁사의 국내/해외 점유율을 비교 정리합니다. 수치 별 출처·연도·추정 방법을 명확히 표기합니다.
  expected_output: > 
    1. 표 형태: [지역 | 시장(세그먼트) | 규모(연도, 통화) | {company} 점유율(연도) | 경쟁사 점유율 | 출처 | 주석(추정법)]
    2. 불확실성/공신력 평가(High/Medium/Low + 이유)
  agent: researcher

risk_assessment:
  description: > 
    규제, 재무, 운영, 경쟁, 공급망, 평판, 기술/보안 등 리스크를 식별하고 발생가능성×영향도 매트릭스로 정리합니다. 이어 {company}의 종합 평점을 제시합니다.
  expected_output: >
    1. 리스크 표 형태 : [카테고리 | 이슈 | 발생 가능성(1–5) | 영향도(1–5) | 근거/출처 | 완화 전략 힌트]
    2. 종합 평가(등급 a–D)와 핵심 근거 5개
  agent: researcher


sales_data_cleansing:
  description: > 
    {company} 관련 영업 활동을 수집하여 결측, 중복, 시계열 이상치, 영업 단계 역행 여부를 점검하고 보수적 기준으로 정제합니다.
  expected_output: >
    1. 품질 리포트 : 데이터 결함 목록, 영향 평가, 정제 조치(드랍/보정/플래그)
    2. KPI 스냅샷: 활동량, 접점당 회신율, 스테이지 체류일수, 전환율(전/후 비교 있으면 표기)
  agent: analyst

sales_effectiveness_review:
  description: > 
    {company} 대상 영업 활동이 ICP/세그먼트/의사결정구조에 적합했는지 평가하고, 채널, 메시지, 타이밍, 스테이크홀더 커버리지의 적절성을 분석합니다. 근거 부족 시 보수적으로 판단합니다.
  expected_output: >
    1. 진단표: [영역 | 현재 수행 | 적합/부적합 | 근거 | 개선 포인트]
    2. 리스크 목록(확률·영향 1–5, 촉발 신호, 완화 방안)
  agent: analyst

pipeline_forecasting:
  description: > 
    오픈 딜의 스테이지·금액·닫힘확률(히스토리 기반)로 파이프라인 커버리지와 예상 매출 범위를 산출하고, 낙관/기준/보수 3개 시나리오를 제시합니다.
  expected_output: >
    1. 표 : [딜ID | 스테이지 | 금액 | 확률 | 기대값 | 리스크 플래그]
    2. 시나리오 요약(낙관/기준/보수 Mrr/arr 또는 일시매출)
  agent: analyst

sales_strategy_optimization:
  description: > 
    분석 결과를 바탕으로 영업 확률을 높이는 3–5개의 구체적 전략(예: 멀티스레딩, 세일즈 모션 전환, 레퍼런스 콜, PoC 설계, 가격/패키징 조정)을 우선순위와 예상효과로 정리합니다.
  expected_output: >
    1. 우선순위 로드맵: [순위 | 전략 | 대상자/역할 | 기대효과 | 필요리소스 | 리스크 | 성공지표]
    2. 실행 체크리스트(2주/4주 단위 마일스톤)
  agent: analyst

executive_sales_report:
  description: > 
    상기 분석을 한 문서로 통합하여 경영진/영업리더가 바로 의사결정할 수 있는 형태로 제공합니다.
  expected_output: >
    1. Markdown 리포트(섹션: 개요, 데이터 품질, 효과성 진단, 파이프라인 시나리오, 리스크, 권고안, 다음 단계)
    2. 부록: 핵심 차트/표, 용어 정의
  agent: analyst


activity_log_normalization:
  description: >
    {company} 관련 활동 로그의 날짜/타임존/주체를 표준화하고, 기간 분포를 분석해 요약 기준(주간/월간/분기)을 자동 결정합니다.
  expected_output: >
    1. 표: [원시 이벤트ID | 표준 일시 | 담당자 | 채널 | 요약 기준(주/월/분기)]
    2. 기준 선정 사유 3줄
  agent: summarizer

engagement_summary:
  description: >
    선정된 기간 단위로 주요 접점, 메시지, 반응(열람/응답/미팅 세팅), 스테이지 이동을 압축 요약합니다. 과도한 인과 추정은 피하고 사실 중심으로 씁니다.
  expected_output: >
    기간별 요약 블록(예: “2025-W27”: 핵심 활동 3–5줄, 주요 성과/이슈, 다음 액션)
    표: [기간 | 활동량 | 회신율 | 미팅수 | 스테이지 전환수 | 특이사항]
  agent: summarizer

activity_anomaly_detection:
  description: >
    비정상적 활동 급증/급감, 중복 로그, 시점 불일치, 스테이지 역행 등 이상치를 표시하고 요약 리포트에 함께 첨부합니다.
  expected_output: >
    플래그 리스트: [이상 유형 | 이벤트/기간 | 탐지 규칙 | 영향 | 권장 조치]
    요약 문장 3–5개(경영진용)
  agent: summarizer

one_page_sales_snapshot:
  description: >
    영업팀과 경영진이 빠르게 현황을 파악하도록 핵심 지표와 흐름만 담은 1페이지 요약을 생성합니다.
  expected_output: >
    Markdown: “이번 기간에 무엇이 있었나/무엇이 바뀌었나/지금 위험은 무엇인가/다음에 무엇을 할 것인가”
    하단: 데이터 품질 신뢰도(High/Med/Low) 배지와 근거 2–3개
  agent: summarizer







research_task_backup:
  description: >
    Gather the most up-to-date and relevant information about the {company}.
  expected_output: >
    a concise and structured summary of key facts about {company}, including recent news, business focus, leadership, market status, and competitive positioning.
  agent: researcher

analyze_task_backup:
    description: >
      analyze and summarize the sales activities based on {sales_activity}.
      and analyze the sales activities by date.
      Finally, translate the output into Korean and convert it into JsON format.
    expected_output: >      
      a sequential breakdown of past {sales_activity}, highlighting customer responses, deal progress, objections, and outcomes.
    agent: analyst

consulting_task_backup:
    description: >
      Based on the analyst's and researcher's outputs, develop a tailored sales strategy.
      Finally, translate the output into Korean and convert it into JsON format.
    expected_output: >
       a recommended sales strategy specific to {company}, including the next best action, messaging focus, and potential engagement plan.
    agent: analyst

summarize_task_backup:
    description: >
      Based on the provided {sales_activity} data, analyze and summarize the latest {sales_activity} data on a weekly basis and extract actionable insights.
      Your output should include:
        1. Key decision milestones and issues by timeline
        2. summary of recurring risks or delays
        3. recommendations or strategic next actions
        Keep the summary clear, concise, and suitable for executive-level review
      Finally, translate the output into Korean and convert it into JsON format.
    expected_output: >
        a weekly sales activity summary report including key outcomes, challenges, opportunities, and strategic observations.
    agent: summarizer